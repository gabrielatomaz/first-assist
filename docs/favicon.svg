<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Navy Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2F4F6F" />
      <stop offset="100%" stop-color="#182A3A" />
    </linearGradient>

    <!-- Teal Trace Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#558B8E" />
      <stop offset="100%" stop-color="#4F7F82" />
    </linearGradient>

    <!-- Mustard/Gold Trace Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2C770" />
      <stop offset="100%" stop-color="#DAAB52" />
    </linearGradient>

    <!-- Drop Shadow Filter for Terminal Shapes -->
    <filter id="nodeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F1B27" flood-opacity="0.5" />
    </filter>

    <!-- Outer Gray Shadow Glow for Circle Terminal -->
    <filter id="grayCircleShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#475569" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Rounded Icon Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Engineering Hexagon Grid Frame -->
  <path d="M 256 84 L 404 170 L 404 342 L 256 428 L 108 342 L 108 170 Z" 
        fill="none" stroke="#FFFFFF" stroke-width="5" stroke-opacity="0.14" stroke-linejoin="round" />

  <!-- Core 'FA' Interlocking Circuit Node Traces -->
  <!-- 'F' Branch (Teal - Diagnostic Path) -->
  <path d="M 160 360 L 160 160 L 320 160 M 160 250 L 280 250" 
        fill="none" stroke="url(#tealGrad)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 'A' Apex Link (Mustard - Knowledge Bridge) -->
  <path d="M 256 160 L 352 360 M 204 290 L 320 290" 
        fill="none" stroke="url(#goldGrad)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" />

  <!-- FIRST Shape Terminals (Triangle: Red #ED1C24, Circle: White with Outer & Inner Gray #94A3B8, Square: Blue #0066B3) -->

  <!-- TERMINAL 1: Triangle ▲ (Red #ED1C24) -->
  <g filter="url(#nodeShadow)">
    <polygon points="160,124 190,178 130,178" fill="#ED1C24" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" />
  </g>

  <!-- TERMINAL 2: Circle ● (White with Outer Gray Shadow & Inner Gray Dot #94A3B8) -->
  <g filter="url(#grayCircleShadow)">
    <circle cx="256" cy="160" r="27" fill="#FFFFFF" stroke="#94A3B8" stroke-width="4" />
    <circle cx="256" cy="160" r="9" fill="#94A3B8" />
  </g>

  <!-- TERMINAL 3: Square ■ (Blue #0066B3) -->
  <g filter="url(#nodeShadow)">
    <rect x="326" y="334" width="52" height="52" rx="8" fill="#0066B3" stroke="#FFFFFF" stroke-width="5" />
  </g>

  <!-- Node Trace Connectors -->
  <circle cx="320" cy="160" r="10" fill="#4F7F82" />
  <circle cx="160" cy="360" r="10" fill="#4F7F82" opacity="0.8" />
</svg>
